# Topics readers can follow. Edit here, then run `python -m verilo_workers sync-topics` and
# `python -m verilo_workers enrich --retag`.
#
# Each article is matched to topics by meaning: its headline and snippet are compared with the
# `description` (both turned into embeddings), so the description should read like the news it
# covers. `sections` are feed sections (from sources.toml) that count as this topic outright; only
# precise ones: "world" and "politics" sections are relative to the outlet (to an Indian paper, a US
# election is world news) and carry other subjects, so they are not mapped.
#
# featured  shown as a chip in the wizard and settings, and in the section menu; the rest are
#           found by searching (by name or `aliases`).
# parent    a narrower topic also counts for its parent (Football for Sport), so broad pages
#           never lose stories to narrow topics.
# Order is the order shown to readers.

# --- Featured ---------------------------------------------------------------------------------

