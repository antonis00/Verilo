# Verilo's source registry. Edit here, then run `python -m verilo_workers sync-sources`.
#
# tier     1 = fact base (wire services, public broadcasters), 2 = reputable outlet,
#          3 = shown with a label but never used to write summaries.
# lean     left | lean_left | center | lean_right | right
# kind     wire | public_broadcaster | newspaper | broadcaster | digital | magazine
# basis    why this tier and lean. The first labels are the initial proposal (Nov 2026), made
#          from general knowledge of public media-bias ratings (AllSides, Ad Fontes Media) and
#          NOT checked against those sites line by line; `reviewed` stays empty until the owner
#          has checked each one. Ratings providers' own scores are not shown in the app until
#          their licences are checked.
# feeds    news sections only (opinion sections are left out); `poll` in minutes.
#
# Wire services (Reuters, AP, AFP) publish no public RSS feeds, so none are listed yet:
# the public broadcasters are the fact base until a licensed or API source is added.

