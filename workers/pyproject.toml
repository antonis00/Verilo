[project]
name = "verilo-workers"
version = "0.1.0"
description = "Verilo's news pipeline: ingest feeds, enrich, group into stories, summarise and check."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.0.1", "ruff==0.14.5"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["verilo_workers*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
