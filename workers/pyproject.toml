[project]
name = "verilo-workers"
version = "0.1.0"
description = "Verilo's news pipeline: ingest feeds, enrich, group into stories, summarise and check."
requires-python = ">=3.12"
dependencies = [
  "anthropic==2.10.0",
  "fastembed==0.9.1",
  "feedparser==6.0.14",
  "httpx==0.28.1",
  "numpy==2.5.5",
  "pgvector==0.5.1",
  "psycopg[binary]==3.3.9",
  "python-dotenv==1.2.4",
  "truststore==0.10.5",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.14.5"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["verilo_workers*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Headlines use curly quotes and dashes, and the rules that read them must match them exactly.
ignore = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
