name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install
        run: |
          npm ci --prefix ../..
          npm ci

      - name: Lint, types, format, unit tests
        run: |
          npm run lint
          npm run typecheck
          npm run format:check
          npm test

      # Unused services are switched off in supabase/config.toml.
      - name: Start local Supabase and write .env.local
        working-directory: .
        run: |
          npx supabase start
          KEY=$(npx supabase status -o json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s.slice(s.indexOf('{'))).PUBLISHABLE_KEY))")
          printf 'NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\nNEXT_PUBLIC_SITE_URL=http://localhost:3001\n' "$KEY" > apps/web/.env.local

      - name: Build
        run: npm run build

      - name: End-to-end and accessibility tests
        run: npm run test:e2e

      - name: Lighthouse
        run: npm run lighthouse

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-test-results
          path: |
            apps/web/test-results
            apps/web/.lighthouseci
          retention-days: 7

  workers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/pyproject.toml

      - run: pip install -c requirements.lock -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # The database tests (tests/test_ingest_db.py) need the local Supabase; without it they skip.
      - name: Start local Supabase
        working-directory: .
        run: |
          npm ci
          npx supabase start

      # The embedding model (about 67 MB) is downloaded once and kept between runs.
      - uses: actions/cache@v6
        with:
          path: workers/.cache
          key: fastembed-bge-small-en-v1.5

      # Checks the SQL functions for errors the migrations alone don't catch.
      - name: Database lint
        working-directory: .
        run: npx supabase db lint --level warning --fail-on error

      # Some database tests use the real topic list.
      - name: Load topics
        run: python -m verilo_workers sync-topics

      - name: Tests
        run: pytest -v
