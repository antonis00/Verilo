# Dependency updates, kept quiet: once a month, one grouped pull request per kind of package
# (web, Python, CI), with minor and patch updates only. Major upgrades (which can break things)
# are left out and done on purpose. Security fixes come straight away, whatever the schedule,
# also grouped. Merge only when CI passes; upgrade the Python lock (workers/requirements.lock)
# in the same change as pyproject.toml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        applies-to: version-updates
        patterns: ["*"]
      web-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /workers
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        applies-to: version-updates
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
